{% macro base(id, title, size="lg", header_class="bg-primary text-white", body_id=None) %}
<div class="modal fade" id="{{ id }}" tabindex="-1" aria-labelledby="{{ id }}Label" aria-hidden="true">
    <div class="modal-dialog modal-{{ size }}">
        <div class="modal-content">
            <div class="modal-header {{ header_class }}">
                <h5 class="modal-title" id="{{ id }}Label">{{ title }}</h5>
                <button type="button"
                        class="btn-close {% if 'text-white' in header_class %}btn-close-white{% endif %}"
                        data-bs-dismiss="modal"
                        aria-label="Fechar">
                </button>
            </div>
            <div class="modal-body"{% if body_id %} id="{{ body_id }}"{% endif %}>
                {{ caller() }}
            </div>
        </div>
    </div>
</div>
{% endmacro %}

{% macro confirm_delete(id, title, message, form_action, csrf_token_value, size="md") %}
<div class="modal fade" id="{{ id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-{{ size }}">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">{{ title }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>{{ message }}</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form action="{{ form_action }}" method="POST" class="d-inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
                    <button type="submit" class="btn btn-danger">
                        <i class="fa-solid fa-trash me-1"></i>Remover
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
