[project]
name = "cursos-certificados"
version = "0.1.0"
description = "Sistema de gestão de cursos e treinamentos"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-wtf>=1.2",
    "flask-login>=0.6",
    "flask-cors>=4.0",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "ntplib>=0.4",
    "gunicorn>=22.0",
    "psycopg2-binary>=2.9",
    "weasyprint>=62.0",
    "flask-mail>=0.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["app"]