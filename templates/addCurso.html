<div class="container mt-3">
    <!-- Ajustado: class única para o form -->
    <form action="/cursos/add" method="POST" class="row g-3 needs-validation" novalidate>
        
        <!-- Título -->
        <div class="col-12">
            <label class="form-label fw-bold">Título</label>
            <input type="text" name="titulo" class="form-control" placeholder="Ex: Excel Avançado" required>
            <div class="invalid-feedback">O título é obrigatório.</div>
        </div>

        <!-- Data do Treinamento -->
        <div class="col-md-6">
            <label class="form-label fw-bold">Data do Treinamento</label>
            <input type="date" name="dataCurso" class="form-control" required>
            <div class="invalid-feedback">Selecione uma data.</div>
        </div>

        <!-- Local -->
        <div class="col-md-6">
            <label class="form-label fw-bold">Local</label>
            <input type="text" name="local" class="form-control" placeholder="Ex: Sala 01 ou Remoto" required>
            <div class="invalid-feedback">Informe o local.</div>
        </div>

        <!-- Horários/Duração -->
        <div class="col-12 mt-3">
            <label for="duracaoAulas" class="form-label fw-bold">Horários de cada aula</label>
            <!-- Ajustado: Removido espaços internos do textarea -->
            <textarea class="form-control" name="duracaoAulas" id="duracaoAulas" rows="4" required>{{HorariosAulas}}</textarea>
            <div class="invalid-feedback">Descreva os horários.</div>
            <div class="form-text">Descreva o tempo de duração de cada aula ou módulo.</div>
        </div>
        
        <!-- Definir Turmas -->
        <div class="col-12 mt-3">
            <label class="form-label fw-bold">Definir Turmas e Turnos</label>
            <div class="input-group mb-2">
                <input type="text" id="inputNomeTurma" class="form-control" style="flex: 2;" placeholder="Nome da Turma (ex: T1)">
                <select id="selectTurnoTurma" class="form-select" style="flex: 1;">
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                </select>
                <button class="btn btn-primary" type="button" onclick="adicionarTurmaCompleta()">+ Adicionar</button>
            </div>
            
            <div id="listaTurmasDinamic" class="p-2 border rounded bg-light d-flex flex-wrap" style="min-height: 50px; gap: 10px;">
                <span class="text-muted small">Nenhuma turma definida.</span>
            </div>
            <!-- Dica: Validar se há turmas exige JS customizado, mas mantemos o visual aqui -->
        </div>

        <!-- Situação -->
        <div class="col-md-6">
            <label for="situacao" class="form-label fw-bold">Situação</label>
            <select class="form-select" name="situacao" id="situacao" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="Ativo">Ativo</option>
                <option value="Concluído">Concluído</option>
                <option value="Cancelado">Cancelado</option>
                <option value="Em Andamento">Em Andamento</option>
            </select>
            <div class="invalid-feedback">Selecione a situação atual.</div>
        </div>

        <!-- Botões -->
        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success px-4">Salvar Treinamento</button>
            <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
        </div>
    </form>
</div>
