<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cursos.css') }}">
    <!-- Font Awesome js -->
    <script src="https://kit.fontawesome.com/82f6f08804.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/cursos.js') }}" defer ></script>
    <title>Turmas dos treinamentos</title>
  </head>
  <body oncontextmenu="return false;" onselectstart="return false;">
    <h1>Turmas dos treinamentos</h1>
     <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ModalNovoCurso" onclick="carregarFormulario()">
    Novo Treinamento
</button>
      <br>
      <table>
         <thead>
            <th>Id</th>
            <th>Titulo Curso</th>
            <th>Data Curso</th>
            <th>Local</th>
            <th>Situacao</th>
            <th>#</th>
         </thead>
         {% for curso in cursos %}
         <tbody>
            <td>{{curso.idCurso}}</td>
            <td>{{curso.titulo}}</td>
            <td>{{curso.dataCurso}}</td>
            <td>{{curso.local}}</td>
            <td>{{curso.situacao}}</td>
            <td><a href="{{url_for('curso.DeletarCurso, idCurso = curso.idCurso)')}}/delete/{{idCurso}}" type="button">Delete</a></td>
         </tbody>
         {% endfor%}
      </table>
    
    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
  <!-- Modal novo curso -->
<div class="modal fade dark" id="ModalNovoCurso" tabindex="-1" role="dialog" aria-labelledby="ModalNovoCurso" aria-hidden="false">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title" style="color: blue;" id="exampleModalLabel" class="mb-4 text-primary">Novo Formulario de Treinamento</h1>
        <button type="button" data-dismiss="modal" aria-label="Close" onclick="fechamodal('ModalNovoCurso')">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
     <div class="modal-body" id="modalBodyNovoCurso">
        <!-- O formulário será carregado aqui -->
        Carregando...
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="fechamodal('ModalNovoCurso')" data-dismiss="modal">fechar</button>
      </div>
    </div>
  </div>
</div>
</html>

</script>
